# ============================================
# ABXY ARCADE 离线部署（镜像已内置，不联网）
#
# 用法：
#   docker compose up -d
#   换端口： PORT=8080 docker compose up -d
#
# 不熟悉 compose 的话直接用 install.sh（Linux/NAS）或 start.bat（Windows）。
#
# images/ 里两个架构的包，导入后镜像名都是 abxy-arcade:__VERSION__，
# 所以 x86 和 ARM 机型都不用改这里。
# ============================================
services:
  abxy-arcade:
    image: abxy-arcade:__VERSION__
    container_name: abxy-arcade
    ports:
      - "${PORT:-30000}:3000"
    environment:
      DATA_DIR: /data
      PORT: "3000"
      TZ: "${TZ:-Asia/Shanghai}"
      # 首次启动自动创建的管理员（已存在则忽略）
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      ALLOW_REGISTER: "${ALLOW_REGISTER:-true}"
    volumes:
      # 数据、封面、ROM 都在这个目录里，备份只备这一个
      - "./data:/data"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
