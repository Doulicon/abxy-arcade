services:
  abxy-arcade:
    build:
      context: .
      dockerfile: Dockerfile
    image: abxy-arcade:latest
    container_name: abxy-arcade
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      # 生产环境请改成随机长字符串，修改后所有已登录用户需要重新登录
      JWT_SECRET: "please-change-this-secret-in-production"
      # 首次启动时自动创建的管理员账号（已存在则忽略）
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin123"
      # 是否开放普通用户注册
      ALLOW_REGISTER: "true"
      # 模拟器内核 CDN，国内可换成自建镜像地址
      # EMULATOR_CDN: "https://cdn.emulatorjs.org/stable/data/"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
